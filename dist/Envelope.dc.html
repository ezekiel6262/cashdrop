<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&display=swap">
</helmet>
<div style="container-type:inline-size;width:100%;">
<div style="position:relative;width:100%;aspect-ratio:684 / 428;background:{{bg}};border-radius:3.6cqw;overflow:hidden;box-shadow:0 3cqw 8cqw rgba(0,0,0,.45);color:#1c1b17;">
<svg viewBox="0 0 684 428" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;fill:none;">
<path d="M0 0L342 205L684 0M0 428L262 258M684 428L422 258" style="stroke:{{line}};stroke-width:1.6;"></path>
<path d="M0 350q45 -12 90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0" style="stroke:{{wave}};stroke-width:1.4;"></path>
<path d="M-30 361q45 -12 90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0" style="stroke:{{wave}};stroke-width:1.4;"></path>
<path d="M-60 372q45 -12 90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0t90 0" style="stroke:{{wave}};stroke-width:1.4;"></path>
</svg>
<div style="position:absolute;top:4.6cqw;left:4.7cqw;right:4.7cqw;display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:2.75cqw;letter-spacing:.2em;color:{{ink2}};white-space:nowrap;">
<span>PRIVATE CASHDROP · SHIELDED</span><span>No. {{number}}</span>
</div>
<sc-if value="{{sealed}}" hint-placeholder-val="{{true}}">
<div style="position:absolute;left:50%;top:47.9%;transform:translate(-50%,-50%);width:15.2cqw;aspect-ratio:1;border-radius:50%;background:#f4b729;border:0.9cqw solid #dc9a12;box-shadow:0 1cqw 2.4cqw rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;">
<svg viewBox="0 0 24 24" style="width:52%;height:52%;fill:none;stroke:#1c1b17;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;"><path d="M7 7h10L7 17h10M12 3.5V7M12 17v3.5"></path></svg>
</div>
</sc-if>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;left:50%;top:47.9%;transform:translate(-50%,-50%);width:15.2cqw;aspect-ratio:1;border-radius:50%;border:0.45cqw dashed {{dash}};"></div>
</sc-if>
<div style="position:absolute;left:4.7cqw;bottom:5.4cqw;right:28cqw;">
<div style="display:flex;align-items:baseline;gap:1.6cqw;">
<span style="font-family:'DM Mono',monospace;font-size:10.4cqw;font-weight:500;letter-spacing:-0.03em;line-height:1;">{{amount}}</span>
<span style="font-family:'Bricolage Grotesque',sans-serif;font-size:3.6cqw;font-weight:800;">ZEC</span>
</div>
<sc-if value="{{hasNote}}" hint-placeholder-val="{{true}}">
<div style="margin-top:1.2cqw;font-family:'Bricolage Grotesque',sans-serif;font-style:italic;font-size:3.5cqw;color:{{ink2}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">“{{note}}”</div>
</sc-if>
</div>
<div style="position:absolute;right:4cqw;bottom:4.6cqw;border:0.35cqw solid #1c1b17;border-radius:0.9cqw;padding:0.7cqw 1.8cqw;transform:rotate(-6deg);font-family:'DM Mono',monospace;font-weight:500;font-size:2.8cqw;letter-spacing:.2em;white-space:nowrap;">{{stamp}}</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;420px&quot;,&quot;height&quot;:&quot;280px&quot;},&quot;amount&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0.0100&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Thanks for helping with the event&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;number&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CD-7Q4K&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stamp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SEALED&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sealed&quot;,&quot;opened&quot;,&quot;empty&quot;],&quot;default&quot;:&quot;sealed&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'sealed';
    const empty = v === 'empty';
    const note = this.props.note ?? 'Thanks for helping with the event';
    return {
      amount: this.props.amount ?? '0.0100', note, hasNote: !!note,
      number: this.props.number ?? 'CD-7Q4K', stamp: this.props.stamp ?? 'SEALED',
      sealed: v === 'sealed', open: v !== 'sealed',
      bg: empty ? '#8f8b7d' : '#ebe4d3',
      line: empty ? 'rgba(40,38,30,.35)' : 'rgba(120,110,85,.35)',
      wave: empty ? 'rgba(70,65,40,.3)' : 'rgba(214,186,110,.55)',
      ink2: empty ? '#3b392f' : '#5b574b',
      dash: empty ? '#4a473d' : '#7a7566'
    };
  }
}
</script>
</body>
</html>
